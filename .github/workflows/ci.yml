name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'proximus-fork-**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 10 (preview SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Print SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore FileIt.All.sln

      - name: Build (Release)
        run: dotnet build FileIt.All.sln --configuration Release --no-restore

      - name: Run unit and architecture tests (exclude Integration)
        run: dotnet test FileIt.All.sln --configuration Release --no-build --filter "FullyQualifiedName!~Integration" --logger "trx;LogFileName=results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
